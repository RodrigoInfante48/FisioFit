<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FisioFit — Alimentación</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>
    // Aplica el tema guardado antes del primer paint, para evitar el flash
    // del tema por defecto (ver scripts/ui-controls.js).
    (function () {
      try {
        var theme = localStorage.getItem("fisiofit-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/nutrition.css" />
</head>
<body>
  <div class="auth-loading" aria-hidden="true">
    <div class="auth-loading__spinner"></div>
  </div>

  <div class="nutrition-page auth-gated">
    <header class="app-header">
      <button
        class="hamburger-btn"
        type="button"
        id="hamburger-btn"
        aria-expanded="false"
        aria-controls="app-nav"
        aria-label="Abrir menú"
      >
        <span class="hamburger-btn__line"></span>
        <span class="hamburger-btn__line"></span>
        <span class="hamburger-btn__line"></span>
      </button>
      <div class="app-brand">
        <h1 class="app-title">FisioFit</h1>
        <p class="app-tagline">Acceso exclusivo por paquete</p>
      </div>
      <div class="app-nav glass-panel glass-nav" id="app-nav">
        <a class="glass-btn glass-btn--back" href="index.html">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 12H5M11 6l-6 6 6 6" />
          </svg>
          <span>Entrenamiento</span>
        </a>
        <div class="app-nav__actions">
          <button class="glass-btn glass-btn--theme-toggle" type="button" id="theme-toggle-btn" aria-pressed="false" aria-label="Cambiar a tema claro">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
            <span>Tema</span>
          </button>
          <button class="glass-btn glass-btn--logout" type="button" id="logout-btn" hidden>
            Salir
          </button>
        </div>
      </div>
    </header>

    <main class="nutrition-main">
      <section class="nutrition-intro glass-panel">
        <h1 class="nutrition-intro__title" id="nutrition-intro-title"></h1>
        <p class="nutrition-intro__text" id="nutrition-intro-text"></p>
      </section>

      <section
        class="nutrition-carousel glass-panel"
        id="nutrition-carousel"
        tabindex="0"
        aria-roledescription="carrusel"
        aria-label="Plan de comidas por día"
      >
        <div class="nutrition-carousel__tabs" role="tablist" aria-label="Elegir día de la semana"></div>

        <div class="nutrition-carousel__viewport">
          <div class="nutrition-carousel__track"></div>
        </div>

        <div class="nutrition-carousel__progress">
          <div class="nutrition-carousel__progress-bar"></div>
        </div>

        <div class="nutrition-carousel__controls">
          <button class="nutrition-carousel__arrow nutrition-carousel__arrow--prev" type="button" aria-label="Día anterior">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>

          <div class="nutrition-carousel__dots"></div>

          <button class="nutrition-carousel__arrow nutrition-carousel__arrow--next" type="button" aria-label="Día siguiente">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 6l6 6-6 6" />
            </svg>
          </button>

          <button class="nutrition-carousel__playpause" type="button" aria-pressed="false" aria-label="Pausar avance automático">
            <svg class="icon-play" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
              <path d="M7 5h4v14H7zM13 5h4v14h-4z" />
            </svg>
          </button>
        </div>

        <p class="visually-hidden nutrition-carousel__announcer" aria-live="polite"></p>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/auth-guard.js"></script>
  <script src="data/nutrition-content.js"></script>
  <script src="scripts/nutrition.js"></script>
  <script src="scripts/ui-controls.js"></script>
  <script>
    document.getElementById("nutrition-intro-title").textContent = NUTRITION_INTRO.titulo;
    document.getElementById("nutrition-intro-text").textContent = NUTRITION_INTRO.texto;
  </script>
</body>
</html>
