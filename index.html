<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FisioFit</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <script>
    // Aplica el tema guardado antes del primer paint, para evitar el flash
    // del tema por defecto (ver scripts/ui-controls.js).
    (function () {
      try {
        var theme = localStorage.getItem("fisiofit-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles/tokens.css?v=2" />
  <link rel="stylesheet" href="styles/main.css?v=2" />
  <link rel="stylesheet" href="styles/muscle-figure.css?v=2" />
  <link rel="stylesheet" href="styles/info-panel.css?v=2" />
</head>
<body>
  <div class="auth-loading" aria-hidden="true">
    <div class="auth-loading__spinner"></div>
  </div>

  <div class="app auth-gated">
    <header class="app-header">
      <button
        class="hamburger-btn"
        type="button"
        id="hamburger-btn"
        aria-expanded="false"
        aria-controls="app-nav"
        aria-label="Abrir menú"
        data-i18n-aria-label="nav.openMenu"
      >
        <span class="hamburger-btn__line"></span>
        <span class="hamburger-btn__line"></span>
        <span class="hamburger-btn__line"></span>
      </button>
      <div class="app-brand">
        <h1 class="app-title">FisioFit</h1>
        <p class="app-tagline" data-i18n="app.tagline">Acceso exclusivo por paquete</p>
      </div>
      <div class="app-nav glass-panel glass-nav" id="app-nav">
        <nav class="movement-menu" aria-label="Patrón de movimiento" data-i18n-aria-label="nav.movementPattern">
          <button class="glass-btn" type="button" data-movement="push" aria-pressed="false">Push</button>
          <button class="glass-btn" type="button" data-movement="pull" aria-pressed="false">Pull</button>
          <button class="glass-btn" type="button" data-movement="legs" aria-pressed="false">Legs</button>
        </nav>
        <div class="app-nav__actions">
          <a class="glass-btn glass-btn--nutrition" href="nutricion.html">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3c-1.6 0-3 1.5-3 3.5C9 8 10 9.5 11 10.5c-3 .5-6 3-6 7.5 0 1.3.4 2.5 1 3" />
              <path d="M15 2c0 3-1.5 4.5-1.5 7s1.5 3 1.5 6" />
              <path d="M6 21c1-4 3-6 6-6s5 2 6 6" />
            </svg>
            <span data-i18n="nav.nutrition">Alimentación</span>
          </a>
          <button class="glass-btn glass-btn--theme-toggle" type="button" id="theme-toggle-btn" aria-pressed="false" aria-label="Cambiar a tema claro">
            <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
            </svg>
            <span data-i18n="nav.theme">Tema</span>
          </button>
          <div class="lang-selector">
            <button class="glass-btn glass-btn--lang" type="button" id="lang-toggle-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="lang-list">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M3 12h18M12 3c2.5 2.6 3.8 6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-6-3.8-9s1.3-6.4 3.8-9Z" />
              </svg>
              <span data-i18n="nav.language">Idioma</span>
              <span class="lang-selector__current" id="lang-current-code" aria-hidden="true">ES</span>
            </button>
            <div class="lang-selector__list" id="lang-list" role="listbox" aria-label="Idiomas disponibles" data-i18n-aria-label="nav.languageList" hidden>
              <button type="button" class="lang-option" data-lang="es" role="option" aria-selected="true"><span>Español</span><span class="lang-option__code">ES</span></button>
              <button type="button" class="lang-option" data-lang="en" role="option" aria-selected="false"><span>English</span><span class="lang-option__code">EN</span></button>
              <button type="button" class="lang-option" data-lang="pt" role="option" aria-selected="false"><span>Português</span><span class="lang-option__code">PT</span></button>
              <button type="button" class="lang-option" data-lang="de" role="option" aria-selected="false"><span>Deutsch</span><span class="lang-option__code">DE</span></button>
              <button type="button" class="lang-option" data-lang="fr" role="option" aria-selected="false"><span>Français</span><span class="lang-option__code">FR</span></button>
              <button type="button" class="lang-option" data-lang="zh" role="option" aria-selected="false"><span>中文</span><span class="lang-option__code">ZH</span></button>
              <button type="button" class="lang-option" data-lang="ru" role="option" aria-selected="false"><span>Русский</span><span class="lang-option__code">RU</span></button>
              <button type="button" class="lang-option" data-lang="ja" role="option" aria-selected="false"><span>日本語</span><span class="lang-option__code">JA</span></button>
            </div>
          </div>
          <button class="glass-btn glass-btn--logout" type="button" id="logout-btn" hidden>
            <span data-i18n="nav.logout">Salir</span>
          </button>
        </div>
      </div>
    </header>

    <main class="stage glass-panel glass-panel--stage">
      <button
        class="figure-zoom-reset-btn glass-btn"
        type="button"
        id="zoom-reset-btn"
        aria-label="Volver al encuadre completo"
        title="Volver"
        aria-hidden="true"
        tabindex="-1"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button
        class="figure-rotate-btn glass-btn"
        type="button"
        id="rotate-figure-btn"
        aria-label="Girar figura (frontal / posterior)"
        title="Girar figura"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3-6.7" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
      </button>
      <div class="figure-view-badge" id="figure-view-badge" aria-hidden="true">
        <span class="figure-view-badge__label figure-view-badge__label--front">Frente</span>
        <span class="figure-view-badge__label figure-view-badge__label--back">Espalda</span>
      </div>
      <!-- Aquí irá la figura muscular (frontal/posterior) -->
    </main>

    <section class="info-panel glass-panel glass-panel--info" aria-live="polite">
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="scripts/firebase-config.js?v=2"></script>
  <script src="scripts/auth-guard.js?v=2"></script>
  <script src="scripts/i18n.js?v=2"></script>
  <script src="scripts/muscle-figure.js?v=2"></script>
  <script src="data/muscle-content.js?v=2"></script>
  <script src="scripts/muscle-content-panel.js?v=2"></script>
  <script src="scripts/main.js?v=2"></script>
  <script src="scripts/ui-controls.js?v=2"></script>
</body>
</html>
