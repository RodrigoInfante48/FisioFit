<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FisioFit</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/muscle-figure.css" />
  <link rel="stylesheet" href="styles/info-panel.css" />
</head>
<body>
  <div class="app">
    <header class="app-header glass-panel glass-nav">
      <span class="app-header__logo">FisioFit</span>
      <nav class="movement-menu" aria-label="Patrón de movimiento">
        <button class="glass-btn" type="button" data-movement="push" aria-pressed="false">Push</button>
        <button class="glass-btn" type="button" data-movement="pull" aria-pressed="false">Pull</button>
        <button class="glass-btn" type="button" data-movement="legs" aria-pressed="false">Legs</button>
      </nav>
    </header>

    <main class="stage glass-panel glass-panel--stage">
      <button
        class="figure-zoom-reset-btn glass-btn"
        type="button"
        id="zoom-reset-btn"
        aria-label="Volver al encuadre completo"
        title="Volver"
        aria-hidden="true"
        tabindex="-1"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="8" />
          <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none" />
        </svg>
      </button>
      <button
        class="figure-rotate-btn glass-btn"
        type="button"
        id="rotate-figure-btn"
        aria-label="Girar figura (frontal / posterior)"
        title="Girar figura"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3-6.7" />
          <polyline points="21 3 21 9 15 9" />
        </svg>
      </button>
      <!-- Aquí irá la figura muscular (frontal/posterior) -->
    </main>

    <section class="info-panel glass-panel glass-panel--info" aria-live="polite">
    </section>
  </div>

  <script src="scripts/muscle-figure.js"></script>
  <script src="data/muscle-content.js"></script>
  <script src="scripts/muscle-content-panel.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
